name: Build and Deploy Status App

on:
  push:
    branches:
      - main
    paths:
      - 'application/**'
      - 'ansible/deploy-app.yml'
      - '.github/workflows/build.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./application
          push: true
          tags: |
            ghcr.io/dani21894/status-app:latest
            ghcr.io/dani21894/status-app:${{ github.sha }}

  security-scan:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/dani21894/status-app:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    needs: security-scan

    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Ansible Vault password file
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "$RUNNER_TEMP/.vault_pass"
          chmod 600 "$RUNNER_TEMP/.vault_pass"

      - name: Test Ansible connectivity
        run: |
          ansible all \
            -i ansible/inventory/hosts.ini \
            -m ping

      - name: Deploy application
        run: |
          ansible-playbook \
            -i ansible/inventory/hosts.ini \
            ansible/deploy-app.yml \
            -e status_app_tag=${{ github.sha }}

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i ansible/inventory/hosts.ini \
            ansible/grafana.yml \
            --vault-password-file "$RUNNER_TEMP/.vault_pass"

      - name: Verify application
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 5 \
            http://192.168.100.249

      - name: Remove Vault password file
        if: always()
        run: rm -f "$RUNNER_TEMP/.vault_pass"